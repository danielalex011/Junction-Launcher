<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: junction-icon:; media-src https:; frame-src 'self' about: data:; connect-src 'none'; object-src 'none'; base-uri 'none'">
  <title>Junction</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="brand">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 3l8 9 8-9"/><path d="M12 12v9"/><circle cx="12" cy="12" r="2.2" fill="currentColor" stroke="none"/></svg>
        <span>Junction</span>
      </div>
      <nav id="nav"></nav>
      <div class="spacer"></div>
      <button id="activity-btn" class="activity-btn" type="button" title="Downloads and installs"></button>
      <button id="account-chip" class="account-chip" type="button"></button>
    </aside>
    <main id="view"></main>
  </div>
  <div id="modal-root"></div>
  <div id="toasts"></div>
  <div id="drop-hint">Drop a .mrpack or CurseForge .zip to import it</div>
  <!-- Plain scripts sharing one global scope, no bundler. Order matters: helpers first, app.js last (it runs init()). -->
  <script src="helpers.js"></script>
  <script src="dialogs.js"></script>
  <script src="activity.js"></script>
  <script src="accounts.js"></script>
  <script src="home.js"></script>
  <script src="library.js"></script>
  <script src="import.js"></script>
  <script src="instance.js"></script>
  <script src="content.js"></script>
  <script src="updates.js"></script>
  <script src="browse.js"></script>
  <script src="settings.js"></script>
  <script src="app.js"></script>
</body>
</html>
